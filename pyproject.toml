[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sparkprompt"
version = "0.1.0"
description = "A multi-provider educational prompt-writing simulator."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Nitin Sagar" }]
dependencies = [
  "anthropic>=0.75,<2",
  "google-genai>=1,<2",
  "openai>=2,<3",
  "streamlit>=1.37,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkprompt"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
